<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#181c19">
<title>Seona Eko</title>
<style>
  :root{--bg:#181c19;--panel:#1f2521;--ink:#edf0e7;--soft:#b3bcae;--line:#38423c;--accent:#dd985f;--accent-ink:#2a0f17;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:440px;margin:0 auto;padding:32px 16px calc(32px + env(safe-area-inset-bottom,0px));}
  .mark{width:44px;height:44px;color:var(--accent);margin-bottom:18px;}
  h1{font-size:1.6rem;margin:0 0 8px;font-weight:700;letter-spacing:.01em;}
  p{margin:0 0 14px;color:var(--soft);line-height:1.45;}
  .addr{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 18px;color:var(--ink);font-size:.95rem;word-break:break-all;}
  a.btn{display:block;text-align:center;background:var(--accent);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:14px;padding:15px 18px;font-size:1.05rem;}
  .langs{display:flex;gap:6px;margin-top:28px;justify-content:center;}
  .langs button{background:none;border:1px solid var(--line);color:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.85rem;}
  .langs button[aria-pressed="true"]{background:var(--panel);color:var(--ink);}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 22V11M12 11 6 3M12 11l6-8M8.5 6.5 6 7M15.5 6.5 18 7"/></svg>
  <h1 id="t"></h1>
  <p id="x"></p>
  <span class="addr" id="a"></span>
  <a class="btn" id="b" href="https://seona-eko.github.io/seona-eko/"></a>
  <p id="h" style="margin-top:16px;font-size:.9rem"></p>
  <div class="langs"><button data-l="hr">HR</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
</main>
<script>
  var NEU = 'https://seona-eko.github.io/seona-eko/';
  var T = {
    hr: { t: 'Aplikacija je preseljena', x: 'Seona Eko ima novu adresu:', b: 'Otvori', h: 'Staru aplikaciju obrišite s početnog zaslona, a novu instalirajte s nove adrese.' },
    en: { t: 'The app has moved', x: 'Seona Eko has a new address:', b: 'Open', h: 'Remove the old app from your home screen and install the new one from the new address.' },
    de: { t: 'Die App ist umgezogen', x: 'Seona Eko hat eine neue Adresse:', b: 'Öffnen', h: 'Alte App vom Startbildschirm löschen und die neue unter der neuen Adresse installieren.' }
  };
  function zeig(l) {
    var s = T[l] || T.hr;
    document.documentElement.lang = l;
    document.getElementById('t').textContent = s.t;
    document.getElementById('x').textContent = s.x;
    document.getElementById('a').textContent = NEU.replace('https://', '');
    document.getElementById('b').textContent = s.b;
    document.getElementById('h').textContent = s.h;
    [].forEach.call(document.querySelectorAll('.langs button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-l') === l)); });
  }
  var l = 'hr';
  try { l = localStorage.getItem('seona_lang') || ''; } catch (e) {}
  if (!T[l]) { var n = (navigator.language || 'hr').slice(0, 2); l = T[n] ? n : 'en'; }
  zeig(l);
  [].forEach.call(document.querySelectorAll('.langs button'), function (b) { b.onclick = function () { zeig(b.getAttribute('data-l')); }; });
  // Alte App aufräumen: zwischengespeicherte Version und Hintergrunddienst entfernen
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (r) { r.forEach(function (x) { x.unregister(); }); }).catch(function () {});
  if (window.caches) caches.keys().then(function (k) { k.forEach(function (n) { caches.delete(n); }); }).catch(function () {});
</script>
</body>
</html>
